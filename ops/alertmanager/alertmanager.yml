# Replace the webhook URL (Slack/Teams/PagerDuty/etc.) before relying on notifications.
route:
  receiver: default
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: default
      repeat_interval: 1h
receivers:
  - name: default
    webhook_configs:
      - url: http://host.docker.internal:9000/alerts   # TODO: your alert receiver
        send_resolved: true
